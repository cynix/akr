name: FreeBSD

on:
  push:
    branches:
      - freebsd
  workflow_dispatch:

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target:
          - arch: amd64
            triple: x86_64-unknown-freebsd
            cargo_args:

          - arch: arm64
            triple: aarch64-unknown-freebsd
            cargo_args: -Z build-std

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build
        run: |
          docker run --rm -v $(pwd):/work -e BUILDER_UID=$(id -u) -e BUILDER_GID=$(id -g) -e BUILDER_USER=$(id -un) -e BUILDER_GROUP=$(id -gn) -e FREEBSD_TARGET=${{ matrix.target.arch }} ghcr.io/cynix/dockcross-freebsd env CARGO_FEATURE_STD=true CARGO_PROFILE_RELEASE_STRIP=true cargo build --release ${{ matrix.target.cargo_args }}
          tar -C target/${{ matrix.target.triple }}/release/ -zcf akr-${GITHUB_SHA::7}-${{ matrix.target.triple }}.tar.gz --numeric-owner --owner=0 --group=0 ./akr

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target.triple }}
          path: akr-*-${{ matrix.target.triple }}.tar.gz
          compression-level: 0
          if-no-files-found: error
          retention-days: 1

  release:
    name: Release
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Release
        run: |
          gh release delete --cleanup-tag --yes edge || true
          gh release create --prerelease --notes=${GITHUB_SHA} --title=edge edge ./akr-*.tar.gz
        env:
          GH_TOKEN: ${{ github.token }}
